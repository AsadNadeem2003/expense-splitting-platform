name: Deploy SplitEase to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting SplitEase automated deployment on EC2..."
            
            # 1. Pull latest code from main
            cd /var/www/splitease
            git pull origin main

            # 2. Update Backend
            echo "📦 Updating Backend..."
            cd /var/www/splitease/backend
            npm install
            npx prisma db push
            pm2 restart splitease-api || pm2 start "npx tsx src/index.ts" --name "splitease-api"
            pm2 save

            # 3. Update Frontend
            echo "🎨 Building Frontend..."
            cd /var/www/splitease/frontend
            npm install
            npm run build

            # 4. Reload Nginx
            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "✅ Deployment completed successfully!"
